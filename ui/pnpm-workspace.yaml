# pnpm v10+ will not run a dependency's build script (postinstall, etc.)
# unless explicitly approved. These three are safe and expected:
#   sharp          — native image bindings used by next/image optimization
#   msw            — mock-service-worker (dev/test)
#   unrs-resolver  — native resolver used by the eslint import plugin
allowBuilds:
  msw: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - msw
  - sharp
  - unrs-resolver
